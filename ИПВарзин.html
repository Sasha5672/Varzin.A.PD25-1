   function renderCards(data) {
        const container = document.getElementById('collection');
        container.innerHTML = data.map((item) => `
            <div class="card" onclick="openModal('${item.name}')">
                <img src="${item.img}" alt="${item.name}">
                <div class="card-content">
                    <div class="tag">${item.type}</div>
                    <div style="font-size: 0.9rem; margin-bottom: 5px;">Год: ${item.year}</div>
                    <h3>${item.name}</h3>
                </div>
            </div>
        `).join('');
    }
    function openModal(name) {
        const item = database.find(element => element.name === name);
        if (!item) return; 
        const modal = document.getElementById('infoModal');
        const content = document.getElementById('modalData');
        
        content.innerHTML = `
            <img src="${item.img}" alt="${item.name}">
            <h2>${item.name} (${item.year})</h2>
            <p><strong>Краткая сводка:</strong></p>
            <p>${item.info}</p>
            <div class="stamp">ПРОВЕРЕНО</div>
        `;
        modal.style.display = "block";
    }
    function closeModal() {
        document.getElementById('infoModal').style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('infoModal')) closeModal();
    }

    function search() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = database.filter(item => 
            item.name.toLowerCase().includes(query) || item.year.toString().includes(query)
        );
        renderCards(filtered);
    }

    function filterCategory(category) {
        if (category === 'все') return renderCards(database);
        const filtered = database.filter(item => item.type === category);
        renderCards(filtered);
    }

    renderCards(database);
</script>
